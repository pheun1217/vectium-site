<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTIUM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Pretendard", sans-serif;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">VECTIUM</div>
    <h1>사이트 점검 중입니다.</h1>
    <p>
      더 나은 서비스를 위해 웹사이트를 정비하고 있습니다.<br />
      곧 새로운 모습으로 찾아뵙겠습니다.
    </p>
  </main>
</body>
</html>
